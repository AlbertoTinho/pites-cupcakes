{% extends 'base.html' %}{% block content %}<a href="{{ url_for('catalog') }}">← Catálogo</a><article class="panel"><div class="cup">🧁</div><h1>{{ product.nome }}</h1><p>{{ product.descricao }}</p><p>Sabor: {{ product.sabor }}</p><h2>{{ product.preco_centavos|money }}</h2><p>{{ product.estoque }} unidades disponíveis</p>{% if product.estoque %}<form method="post" action="{{ url_for('cart') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="produto_id" value="{{ product.id }}"><input type="hidden" name="acao" value="adicionar"><label>Quantidade<input type="number" name="quantidade" min="1" max="{{ product.estoque }}" value="1" required></label><button>Adicionar ao carrinho</button></form>{% else %}<p class="notice">Produto esgotado</p>{% endif %}</article>{% endblock %}
