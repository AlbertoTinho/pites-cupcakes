{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{ 'Crie sua conta' if register else 'Bem-vindo de volta' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">{% if register %}<label>Nome<input name="nome" maxlength="120" autocomplete="name" required></label>{% endif %}<label>E-mail<input type="email" name="email" maxlength="254" autocomplete="email" required></label>{% if register %}<label>Telefone<input type="tel" name="telefone" maxlength="30" autocomplete="tel" required></label>{% endif %}<label>Senha{% if register %} (pelo menos 8 caracteres){% endif %}<input type="password" name="senha" minlength="8" autocomplete="{{ 'new-password' if register else 'current-password' }}" required></label><button>{{ 'Cadastrar' if register else 'Entrar' }}</button></form>{% if not register %}<p>Ainda não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p>{% endif %}</section>{% endblock %}
