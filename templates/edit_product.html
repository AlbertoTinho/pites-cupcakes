{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{ 'Editar produto' if product else 'Novo produto' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Nome<input name="nome" maxlength="120" value="{{ product.nome if product else '' }}" required></label><label>Descrição<textarea name="descricao">{{ product.descricao or '' if product else '' }}</textarea></label><label>Sabor<input name="sabor" value="{{ product.sabor or '' if product else '' }}"></label><label>Preço em reais (ex.: 12,50)<input name="preco" inputmode="decimal" value="{{ '%.2f'|format(product.preco_centavos / 100) if product else '' }}" required></label><label>Estoque<input name="estoque" type="number" min="0" max="1000000" value="{{ product.estoque if product else 0 }}" required></label><label class="check"><input type="checkbox" name="ativo" {{ 'checked' if not product or product.ativo else '' }}> Produto ativo no catálogo</label><button>Salvar produto</button></form></section>{% endblock %}
